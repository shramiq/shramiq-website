<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHRAMIQ Admin</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #172033;
}

.login-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #102a43;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 35px;
  border-radius: 16px;
  box-shadow: 0 15px 45px rgba(0,0,0,.2);
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 900;
  color: #102a43;
  margin-bottom: 10px;
}

.logo span {
  color: #f59e0b;
}

.login-box h2 {
  text-align: center;
  margin-bottom: 25px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #f59e0b;
  color: white;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.message {
  margin-top: 15px;
  text-align: center;
  color: #b42318;
}

.dashboard {
  display: none;
}

.topbar {
  background: #102a43;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.topbar h1 {
  font-size: 25px;
}

.logout {
  width: auto;
  padding: 9px 18px;
  background: #ef4444;
}

.container {
  max-width: 1200px;
  margin: 35px auto;
  padding: 0 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 20px;
  margin-bottom: 35px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.05);
}

.card h3 {
  color: #667085;
  font-size: 14px;
  margin-bottom: 12px;
}

.number {
  font-size: 32px;
  font-weight: 900;
  color: #102a43;
}

.section {
  background: white;
  padding: 25px;
  border-radius: 14px;
  margin-bottom: 25px;
  overflow-x: auto;
}

.section h2 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th,
td {
  text-align: left;
  padding: 13px;
  border-bottom: 1px solid #eaecf0;
}

th {
  background: #f8fafc;
  font-size: 14px;
}

td {
  font-size: 14px;
}

.loading {
  color: #667085;
}

.error {
  color: #b42318;
}

@media(max-width:800px) {

  .cards {
    grid-template-columns: 1fr 1fr;
  }

}

@media(max-width:500px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .topbar {
    padding: 15px;
  }

}

</style>
</head>


<body>


<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

  <div class="login-box">

    <div class="logo">
      SHRAM<span>IQ</span>
    </div>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <div class="field">

        <label>Email</label>

        <input
          type="email"
          id="email"
          required
        >

      </div>


      <div class="field">

        <label>Password</label>

        <input
          type="password"
          id="password"
          required
        >

      </div>


      <button id="loginButton">
        Login
      </button>

      <div class="message" id="loginMessage"></div>

    </form>

  </div>

</div>


<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

  <div class="topbar">

    <h1>SHRAMIQ Admin</h1>

    <button
      class="logout"
      id="logoutButton">
      Logout
    </button>

  </div>


  <div class="container">


    <div class="cards">

      <div class="card">

        <h3>Total Candidates</h3>

        <div
          class="number"
          id="candidateCount">
          -
        </div>

      </div>


      <div class="card">

        <h3>Total Factories</h3>

        <div
          class="number"
          id="factoryCount">
          -
        </div>

      </div>


      <div class="card">

        <h3>Total Jobs</h3>

        <div
          class="number"
          id="jobCount">
          -
        </div>

      </div>


      <div class="card">

        <h3>Applications</h3>

        <div
          class="number"
          id="applicationCount">
          -
        </div>

      </div>

    </div>


    <div class="section">

      <h2>Latest Candidates</h2>

      <div id="candidateTable">
        <p class="loading">Loading...</p>
      </div>

    </div>


    <div class="section">

      <h2>Latest Factory Requirements</h2>

      <div id="factoryTable">
        <p class="loading">Loading...</p>
      </div>

    </div>


  </div>

</div>


<script>

const SUPABASE_URL =
"https://kudimdzsoremjsjajmnd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dY-hms5DXZ6n2RvB5N-9oA_9NsdgjxI";


const loginScreen =
document.getElementById("loginScreen");

const dashboard =
document.getElementById("dashboard");

const loginForm =
document.getElementById("loginForm");

const loginMessage =
document.getElementById("loginMessage");

const loginButton =
document.getElementById("loginButton");


let accessToken = null;


/* LOGIN */

loginForm.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    loginMessage.textContent = "";


    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;


    try {

      const response =
        await fetch(

          SUPABASE_URL +
          "/auth/v1/token?grant_type=password",

          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              email: email,

              password: password

            })

          }

        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          "Login failed"
        );

      }


      accessToken =
        data.access_token;


      loginScreen.style.display =
        "none";

      dashboard.style.display =
        "block";


      loadDashboard();

    }


    catch(error) {

      loginMessage.textContent =
        error.message;

    }


    finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* DASHBOARD */

async function loadDashboard() {

  await loadCounts();

  await loadCandidates();

  await loadFactories();

}


/* COUNTS */

async function loadCounts() {

  try {

    const headers = {

      "apikey":
        SUPABASE_KEY,

      "Authorization":
        "Bearer " + accessToken,

      "Prefer":
        "count=exact"

    };


    const candidates =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/candidates?select=id",

        { headers }

      );


    const factories =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/factories?select=id",

        { headers }

      );


    const jobs =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/jobs?select=id",

        { headers }

      );


    const applications =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/applications?select=id",

        { headers }

      );


    document.getElementById(
      "candidateCount"
    ).textContent =
      getCount(candidates);


    document.getElementById(
      "factoryCount"
    ).textContent =
      getCount(factories);


    document.getElementById(
      "jobCount"
    ).textContent =
      getCount(jobs);


    document.getElementById(
      "applicationCount"
    ).textContent =
      getCount(applications);

  }

  catch(error) {

    console.error(error);

  }

}


function getCount(response) {

  const range =
    response.headers.get(
      "content-range"
    );

  if (!range) return "0";

  return range.split("/")[1];

}


/* CANDIDATES */

async function loadCandidates() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/candidates?select=full_name,mobile,primary_skill,experience,preferred_location,status,created_at&order=created_at.desc&limit=10",

      {

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken

        }

      }

    );


  if (!response.ok) {

    document.getElementById(
      "candidateTable"
    ).innerHTML =
      "<p class='error'>Unable to load candidates.</p>";

    return;

  }


  const data =
    await response.json();


  if (!data.length) {

    document.getElementById(
      "candidateTable"
    ).innerHTML =
      "<p>No candidates yet.</p>";

    return;

  }


  let html = `

  <table>

    <tr>

      <th>Name</th>
      <th>Mobile</th>
      <th>Skill</th>
      <th>Experience</th>
      <th>Location</th>
      <th>Status</th>

    </tr>

  `;


  data.forEach(candidate => {

    html += `

      <tr>

        <td>${escapeHTML(candidate.full_name)}</td>

        <td>${escapeHTML(candidate.mobile)}</td>

        <td>${escapeHTML(candidate.primary_skill)}</td>

        <td>${escapeHTML(candidate.experience)}</td>

        <td>${escapeHTML(candidate.preferred_location)}</td>

        <td>${escapeHTML(candidate.status)}</td>

      </tr>

    `;

  });


  html += "</table>";


  document.getElementById(
    "candidateTable"
  ).innerHTML = html;

}


/* FACTORIES */

async function loadFactories() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/factories?select=company_name,contact_person,mobile,location,vacancy,workers_required,status,created_at&order=created_at.desc&limit=10",

      {

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken

        }

      }

    );


  if (!response.ok) {

    document.getElementById(
      "factoryTable"
    ).innerHTML =
      "<p class='error'>Unable to load factories.</p>";

    return;

  }


  const data =
    await response.json();


  if (!data.length) {

    document.getElementById(
      "factoryTable"
    ).innerHTML =
      "<p>No factory requirements yet.</p>";

    return;

  }


  let html = `

  <table>

    <tr>

      <th>Company</th>
      <th>Contact Person</th>
      <th>Mobile</th>
      <th>Location</th>
      <th>Vacancy</th>
      <th>Workers</th>
      <th>Status</th>

    </tr>

  `;


  data.forEach(factory => {

    html += `

      <tr>

        <td>${escapeHTML(factory.company_name)}</td>

        <td>${escapeHTML(factory.contact_person)}</td>

        <td>${escapeHTML(factory.mobile)}</td>

        <td>${escapeHTML(factory.location)}</td>

        <td>${escapeHTML(factory.vacancy)}</td>

        <td>${factory.workers_required}</td>

        <td>${escapeHTML(factory.status)}</td>

      </tr>

    `;

  });


  html += "</table>";


  document.getElementById(
    "factoryTable"
  ).innerHTML = html;

}


/* SECURITY */

function escapeHTML(value) {

  if (value === null ||
      value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* LOGOUT */

document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  function() {

    accessToken = null;

    dashboard.style.display =
      "none";

    loginScreen.style.display =
      "flex";

    loginForm.reset();

  }
);

</script>

</body>
</html>
